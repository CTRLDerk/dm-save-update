name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Window module loads
        run: python -c "import dm_save_update.gui"
      - name: Build exe
        run: |
          python -m pip install --upgrade pip pyinstaller
          pyinstaller --onefile --windowed --name DM-Save-Update update.py
      - name: Smoke test of the exe (preview of a test save)
        shell: pwsh
        run: |
          python -c "from tests.test_core import make_mod, write_save; import json; json.dump(make_mod(), open('smoke_mod.json','w')); write_save('smoke/solo/slot_1')"
          $p = Start-Process -FilePath dist\DM-Save-Update.exe -ArgumentList '--mod','smoke_mod.json','--save','smoke\solo\slot_1','--report','smoke_report.txt' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "exe exit code $($p.ExitCode)" }
          Get-Content smoke_report.txt
          if (-not (Select-String -Path smoke_report.txt -Pattern 'globalPerformance' -Quiet)) { throw 'report incomplete' }
      - uses: actions/upload-artifact@v4
        with:
          name: DM-Save-Update-exe
          path: dist/DM-Save-Update.exe
      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DM-Save-Update.exe
          generate_release_notes: true
